services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
  api:
    build: .
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/multitenant_saas
      JWT_SECRET: change-this-before-deploying
      JWT_EXPIRES_IN: 1d
      CLIENT_ORIGIN: http://localhost:5173
    depends_on:
      - mongo
volumes:
  mongo_data:
